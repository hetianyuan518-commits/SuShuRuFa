# Rime schema
# encoding: utf-8
# 短码由键盘壳拦截 v 开头的编码，展开后台下发的话术。
# 本方案只声明识别规则，避免 v 被拼成普通音节。

schema:
  schema_id: susheng_phrase
  name: 苏晟短码
  version: "1.0"

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - affix_segmentor@shortcut
    - punct_segmentor
    - fallback_segmentor
  translators:
    - script_translator@shortcut
    - punct_translator

shortcut:
  tag: shortcut
  # affix_segmentor 会先剥除 prefix `v` 与 suffix `'`，再把中间编码交给 script_translator@shortcut，
  # 因此 susheng_phrase.dict.yaml 里的编码不含开头的 `v`（如“开场问候”对应 `hy` 而非 `vhy`）。
  # 这是 Rime 反查/短码的标准用法（同 reverse_lookup 的 prefix “`” 不会写进词典键）。
  prefix: "v"
  suffix: "'"
  tips: "〔短码〕"
  dictionary: susheng_phrase

recognizer:
  patterns:
    shortcut: "^v[a-z0-9]*'?$"
