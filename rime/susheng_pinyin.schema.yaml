# Rime schema
# encoding: utf-8

schema:
  schema_id: susheng_pinyin
  name: 苏晟全拼
  version: "1.0"
  author:
    - 苏晟输入法

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([a-z]).+([a-z]).+$/$1$2/

translator:
  dictionary: susheng
  spelling_hints: 8
  enable_user_dict: true

recognizer:
  patterns:
    punct: "^/.*$"
    shortcut: "^v[a-z0-9]*$"
