# Rime schema
# encoding: utf-8

schema:
  schema_id: susheng_t9
  name: 苏晟九键
  version: "1.0"

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: "23456789"
  delimiter: " '"
  algebra:
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: susheng
  enable_user_dict: true
  preedit_format:
    - xlit/23456789/abc def ghi jkl mno pqrs tuv wxyz/
