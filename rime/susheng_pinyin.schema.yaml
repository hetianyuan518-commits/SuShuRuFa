# Rime schema
# encoding: utf-8

schema:
  schema_id: susheng_pinyin
  name: 苏晟全拼
  version: "1.0"
  author:
    - 苏晟输入法

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    # 简拼：取音节首字母（zhong → z）。
    - abbrev/^([a-z]).+$/$1/
    # 首+尾字母别名（zhong → zg）。旧写法 /.+([a-z]).+$/ 因尾部 `.+` 会迫使 ([a-z])
    # 锚到倒数第二个字母、且短于 4 字母的音节永远不匹配，改为 `.*([a-z])$` 才能真正取到尾字母。
    - abbrev/^([a-z]).*([a-z])$/$1$2/

translator:
  dictionary: susheng
  spelling_hints: 8
  enable_user_dict: true

recognizer:
  patterns:
    punct: "^/.*$"
    shortcut: "^v[a-z0-9]*$"
